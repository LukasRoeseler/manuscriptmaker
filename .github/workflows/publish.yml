name: Publish article (on merge)

# When a manuscript change lands on main, (re)build it and publish the final
# galleys under docs/articles/<id>/ — GitHub Pages for this repo is
# configured to serve from main:/docs (Settings > Pages), not a gh-pages
# branch, so publishing means committing the built output straight into
# that folder. The OJS native-import package is also attached as a build
# artifact for the editor to upload into OJS.
on:
  push:
    branches: [main]
    paths:
      - "manuscripts/**"
      - "_extensions/**"
      - "themes/**"
      - "engine/**"
      # NOT docs/** - that's the Pages site (preview tool, landing page, and
      # this workflow's own docs/articles/ output). Triggering on it would
      # make any edit to the site - even deleting a published article -
      # rebuild-and-republish every manuscript right back (a feedback loop
      # hit in practice: see the "rebuild everything" fallback below).
  workflow_dispatch: {}   # manual re-run, e.g. after a workflow-only fix that
                          # doesn't itself touch a path above

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Cache TinyTeX + Quarto
        uses: actions/cache@v4
        with:
          path: |
            ~/.TinyTeX
            ~/.local/share/quarto
          key: r2-tex-${{ runner.os }}-${{ hashFiles('_extensions/**') }}

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.5.53"
          tinytex: true

      - name: Install Carlito font + LaTeX packages
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-crosextra-carlito libreoffice-writer emf2svg libwmf-bin librsvg2-bin
          sudo fc-cache -f
          tlmgr install carlito tcolorbox fancyhdr tikzfill tikzpagenodes eso-pic \
            biblatex biber biblatex-apa csquotes orcidlink pifont enumitem \
            microtype xurl placeins booktabs setspace listings authblk \
            pgf etoolbox xcolor || true

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml jinja2

      - name: Build all changed manuscripts on main
        run: |
          chmod +x engine/scripts/build_all.sh
          base="${{ github.event.before }}"
          event="${{ github.event_name }}"
          # Test fixtures (Hussey, R2.2025.001) render fine locally/in CI but
          # must never be published to the live site. They can't use the
          # usual "/_"-prefix exclusion convention like _TEMPLATE, because
          # Quarto itself treats underscore-prefixed directories as
          # reserved/hidden and silently fails to render anything inside
          # them - so they're denylisted by name here instead.
          TEST_FIXTURES='^(Hussey|R2\.2025\.001)$'
          all_manuscripts() { ls -d manuscripts/*/ | sed 's#/$##' | grep -v '/_' | grep -vE "/${TEST_FIXTURES#^}"; }
          if [ "$event" = "workflow_dispatch" ] || [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            # No prior commit to diff against (manual dispatch, or an
            # unexpected push event) - can't tell what changed, so rebuild
            # every manuscript rather than guess.
            changed=$(all_manuscripts)
          else
            touched=$(git diff --name-only "$base" HEAD)
            if echo "$touched" | grep -qE '^(_extensions|themes|engine)/'; then
              # The rendering engine/theme changed - every manuscript's
              # output is potentially affected, so republish all of them.
              changed=$(all_manuscripts)
            else
              # Only specific manuscripts changed (or nothing did) - touch
              # just those, so an unrelated push can't republish everything.
              # Also exclude the test fixtures by name (see TEST_FIXTURES
              # above) even if someone edits them directly.
              changed=$(echo "$touched" | grep '^manuscripts/' \
                        | awk -F/ -v skip="$TEST_FIXTURES" 'NF>=3 && $2 !~ /^_/ && $2 !~ skip {print $1"/"$2}' | sort -u)
            fi
          fi
          mkdir -p _build_out
          for d in $changed; do
            echo "::group::Publishing $d"; engine/scripts/build_all.sh "$d"
            id=$(basename "$d"); out="_build_out/$id"; mkdir -p "$out"
            cp "$d/article.html" "$out/index.html"
            cp "$d/article.pdf" "$out/$id.pdf" 2>/dev/null || true
            cp "$d/article.xml" "$out/$id.xml" 2>/dev/null || true
            cp "$d"/ojs/*.xml "$out/" 2>/dev/null || true
            echo "::endgroup::"
          done
          # Space-joined on one line: $GITHUB_ENV's plain KEY=value form
          # cannot hold a multi-line value (which `ls` on 2+ ids would be).
          echo "BUILT_IDS=$(ls _build_out | tr '\n' ' ')" >> "$GITHUB_ENV"

      - name: Upload OJS import packages
        uses: actions/upload-artifact@v4
        with:
          name: ojs-import-packages
          path: _build_out/**/*_ojs_import.xml

      - name: Commit published articles into docs/articles/ on main
        run: |
          mkdir -p docs/articles
          for id in $BUILT_IDS; do
            rm -rf "docs/articles/$id"
            mkdir -p "docs/articles/$id"
            cp -r "_build_out/$id/." "docs/articles/$id/"
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/articles
          if git diff --cached --quiet; then
            echo "No article output changed — nothing to commit."
          else
            git commit -m "Publish: $BUILT_IDS [skip ci]"
            # --autostash: build byproducts left in the working tree outside
            # docs/articles (intermediate .tex/.aux, _build_out/, etc.) are
            # untracked/modified but never staged, which makes a plain
            # `pull --rebase` refuse to run — autostash shelves them for the
            # rebase and restores them after.
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
